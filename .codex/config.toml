# Configuração de projeto.
# Provider/auth do 9Router ficam em ~/.codex/config.toml, não aqui.

# O combo atual do projeto é roteado pelo provider 9router global.
model = "Luna_Sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
interrupt_message = true
default_subagent_model = "Luna_Sol"
default_subagent_reasoning_effort = "high"
